# PackHub 构建版本矩阵（Minecraft 26.3）
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
# 关闭原生文件监控：部分沙箱/受限环境下 Gradle 的原生 file-watcher 会报 error = 5
org.gradle.vfs.watch=false
# 网络超时，避免某个仓库挂住时整个构建卡死
systemProp.org.gradle.internal.http.connectionTimeout=20000
systemProp.org.gradle.internal.http.socketTimeout=60000

# 目标游戏版本
minecraft_version=26.3

# Fabric
loader_version=0.19.5
fabric_version=0.163.0+26.3
loom_version=1.19.1

# NeoForge
neoforge_version=26.3.0.77
moddev_version=2.0.137

# 模组信息
mod_version=1.0.2
maven_group=com.packhub
archives_base_name=packhub

# 本机 JDK 25（若系统 JAVA_HOME 已是 25 可删掉这一行）
# org.gradle.java.installations.paths=C:\\Program Files\\Java\\jdk-25
