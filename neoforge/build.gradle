plugins {
    id 'net.neoforged.moddev' version "${moddev_version}"
}

base {
    archivesName = "${archives_base_name}-neoforge"
}

sourceSets {
    main {
        java.srcDir rootProject.file('common/src/main/java')
        resources.srcDir rootProject.file('common/src/main/resources')
    }
}

neoForge {
    version = project.neoforge_version

    // 只做客户端模组
    mods {
        packhub {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }
    }
}

processResources {
    inputs.property "version", project.version
    // 显式指定 UTF-8，避免在默认编码非 UTF-8 的机器上把中文描述写坏
    filteringCharset = 'UTF-8'
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

// 排查用：打印编译期 classpath（CI 的 API 探测步骤会用它 javap 出真实签名；
// 联机同步的发包方法名就是靠这一步确认的）
tasks.register('printClasspath') {
    group = 'help'
    description = '打印 NeoForge 编译期 classpath'
    doLast {
        configurations.compileClasspath.files.each { println "CP: " + it }
    }
}
