plugins {
    id 'net.neoforged.moddev' version "${moddev_version}"
}

base {
    archivesName = "${archives_base_name}-neoforge"
}

sourceSets {
    main {
        java.srcDir rootProject.file('common/src/main/java')
        resources.srcDir rootProject.file('common/src/main/resources')
    }
}

neoForge {
    version = project.neoforge_version

    // 只做客户端模组
    mods {
        packhub {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }
    }
}

processResources {
    inputs.property "version", project.version
    // 显式指定 UTF-8，避免在默认编码非 UTF-8 的机器上把中文描述写坏
    filteringCharset = 'UTF-8'
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

// 打印真实网络 API 签名（联机同步用）：CI 里跑一次就能确认发包方法名，
// 免得只靠猜测——本地跑不了 Gradle 时这是唯一的确认手段。
tasks.register('printNetworkApi') {
    description = 'javap 出 NeoForge 网络类签名，用于确认联机同步用到的 API'
    group = 'verification'
    doLast {
        def candidates = [
                'net.neoforged.neoforge.network.PacketDistributor',
                'net.neoforged.neoforge.client.network.ClientPacketDistributor',
                'net.neoforged.neoforge.server.network.ServerPacketDistributor',
                'net.neoforged.neoforge.network.registration.PayloadRegistrar',
        ]
        def classpath = sourceSets.main.compileClasspath
        candidates.each { name ->
            println "########## ${name}"
            def found = classpath.find { entry ->
                entry.name.endsWith('.jar') && new java.util.zip.ZipFile(entry).withCloseable { zip ->
                    zip.getEntry(name.replace('.', '/') + '.class') != null
                }
            }
            if (found == null) {
                println '(未在 classpath 中找到该类)'
                return
            }
            def out = new ByteArrayOutputStream()
            exec {
                commandLine 'javap', '-classpath', found.absolutePath, name
                standardOutput = out
                ignoreExitValue = true
            }
            println out.toString('UTF-8').readLines().take(80).join('\n')
        }
    }
}
