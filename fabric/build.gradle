plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
    archivesName = "${archives_base_name}-fabric"
}

// common 源码与资源直接编进同一个 jar：多加载器工程里最省事、最不容易出错的做法
sourceSets {
    main {
        java.srcDir rootProject.file('common/src/main/java')
        resources.srcDir rootProject.file('common/src/main/resources')
    }
}

loom {
    mods {
        packhub {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Minecraft 26.x 起游戏本体不再混淆，因此**不需要任何 mappings**：
    // 26.1+ 没有 client_mappings，Yarn 也已在 2025 年停止维护。
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // 无混淆后 Loom 不再重映射依赖，官方模板用的就是 implementation
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

processResources {
    inputs.property "version", project.version
    // 显式指定 UTF-8，避免在默认编码非 UTF-8 的机器（中文 Windows）上把中文描述写坏
    filteringCharset = 'UTF-8'
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// 排查用：打印编译期 classpath（CI 里配合 javap 探测真实 API 签名）
tasks.register('printClasspath') {
    group = 'help'
    description = '打印 Fabric 编译期 classpath'
    doLast {
        configurations.compileClasspath.files.each { println "CP: " + it }
    }
}
