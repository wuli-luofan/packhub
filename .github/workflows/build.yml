name: Build PackHub

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'

      # 诊断用：把 26.3 真实的类签名打印出来（本地拉不到工具链时靠这个对齐 API）。
      # 失败不影响后面的构建。
      - name: 探测 26.3 客户端 API 签名
        continue-on-error: true
        run: |
          gradle :fabric:printClasspath -q --no-daemon -Ppackhub.repos=official -Ppackhub.neoforge=false > cp.txt 2>&1 || true
          grep '^CP: ' cp.txt | sed 's/^CP: //' > jars.txt || true
          echo "classpath 条目数: $(wc -l < jars.txt)"
          MC=""
          while read -r jar; do
            if [ -f "$jar" ] && unzip -l "$jar" 2>/dev/null | grep -q 'net/minecraft/client/Minecraft.class'; then MC="$jar"; break; fi
          done < jars.txt
          echo "=== MC jar: $MC ==="
          for cls in \
            net.minecraft.client.gui.screens.Screen \
            net.minecraft.client.gui.components.events.GuiEventListener \
            net.minecraft.client.gui.components.events.AbstractContainerEventHandler \
            net.minecraft.client.gui.GuiGraphicsExtractor \
            net.minecraft.client.Minecraft \
            net.minecraft.client.KeyMapping \
            net.minecraft.client.gui.components.EditBox \
            net.minecraft.client.gui.components.Button ; do
            echo "########## $cls"
            javap -classpath "$MC" "$cls" 2>&1 | head -120 || true
          done
          echo "########## Fabric API 相关类"
          while read -r jar; do
            if [ -f "$jar" ]; then
              unzip -l "$jar" 2>/dev/null | grep -Ei 'keymapping|client/command/v2' | head -12
            fi
          done < jars.txt
          KEYJAR=$(grep -i 'key-mapping' jars.txt | head -1)
          if [ -n "$KEYJAR" ]; then
            echo "########## KeyMappingHelper"
            javap -classpath "$KEYJAR" net.fabricmc.fabric.api.client.keymapping.v1.KeyMappingHelper 2>&1 | head -20 || true
          fi
          CMDJAR=$(grep -i 'command-api' jars.txt | head -1)
          if [ -n "$CMDJAR" ]; then
            echo "########## ClientCommands"
            javap -classpath "$CMDJAR" net.fabricmc.fabric.api.client.command.v2.ClientCommands 2>&1 | head -20 || true
          fi

      - name: 离线逻辑测试（jar 元数据识别 / 待重启队列 / 搜索分面）
        run: gradle :smoke:logic --no-daemon -Ppackhub.repos=official -Ppackhub.neoforge=false

      - name: Mock 服务器测试（Modrinth + CurseForge 两条链路）
        run: gradle :smoke:mock --no-daemon -Ppackhub.repos=official -Ppackhub.neoforge=false

      - name: 构建 Fabric jar
        run: gradle :fabric:build --no-daemon -Ppackhub.repos=official -Ppackhub.neoforge=false

      - name: 构建 NeoForge jar（允许失败，不影响 Fabric 产物）
        continue-on-error: true
        run: gradle :neoforge:build --no-daemon -Ppackhub.repos=official

      - name: 真实 API 冒烟测试（Modrinth 搜索/版本/下载）
        continue-on-error: true
        run: gradle :smoke:run --no-daemon -Ppackhub.repos=official -Ppackhub.neoforge=false

      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packhub-jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
          if-no-files-found: warn
