plugins {
    id 'base'
}

def mirrorsFirst = !providers.gradleProperty('packhub.repos').getOrElse('mirrors').equalsIgnoreCase('official')

allprojects {
    group = project.maven_group
    version = project.mod_version
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
        withSourcesJar()
    }

    repositories {
        def mirrors = {
            maven {
                name = 'BMCLAPI'
                url = 'https://bmclapi2.bangbang93.com/maven/'
            }
            maven {
                name = 'TencentCloud'
                url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/'
            }
            maven {
                name = 'AliyunPublic'
                url = 'https://maven.aliyun.com/repository/public/'
            }
        }
        def official = {
            maven {
                name = 'Fabric'
                url = 'https://maven.fabricmc.net/'
            }
            maven {
                name = 'NeoForged'
                url = 'https://maven.neoforged.net/releases/'
            }
            mavenCentral()
        }
        if (mirrorsFirst) {
            mirrors()
            official()
        } else {
            official()
            mirrors()
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
